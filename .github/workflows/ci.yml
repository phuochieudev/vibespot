name: CI

on:
  push:
    branches: [main]
  pull_request:

# Có commit mới thì huỷ lượt chạy cũ của cùng nhánh cho đỡ tốn thời gian.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phiên bản pnpm lấy từ trường "packageManager" trong package.json gốc.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: Build Docker image (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build image (chưa đẩy đi đâu) rồi chạy thử công cụ migration bên trong để bắt sớm lỗi kiểu
      # thiếu OpenSSL hoặc thiếu quyền ghi mà chỉ lộ ra khi chạy trên server.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: vibespot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm --entrypoint node_modules/.bin/prisma vibespot-api:ci --version
          docker run --rm --entrypoint node vibespot-api:ci -e "import('@vibespot/shared').then(m => console.log('shared OK, exports:', Object.keys(m).length))"

  e2e:
    name: API e2e (cần database thật)
    runs-on: ubuntu-latest
    needs: check
    env:
      # Secret trỏ tới MỘT DATABASE RIÊNG CHO TEST (vd. một Neon branch), không dùng database thật.
      # Chưa đặt secret này thì job tự bỏ qua các bước, không làm CI đỏ.
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only
    steps:
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: pnpm/action-setup@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.DATABASE_URL != ''
        run: pnpm install --frozen-lockfile
      - if: env.DATABASE_URL != ''
        run: pnpm --filter @vibespot/shared build
      - if: env.DATABASE_URL != ''
        run: pnpm --filter @vibespot/api db:deploy
      - if: env.DATABASE_URL != ''
        run: pnpm --filter @vibespot/api test:e2e
      - name: Bỏ qua e2e vì chưa có secret E2E_DATABASE_URL
        if: env.DATABASE_URL == ''
        run: echo "Đặt secret E2E_DATABASE_URL (database test riêng) để chạy e2e trên CI."
